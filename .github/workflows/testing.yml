name: Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tools
        run: python -m pip install --upgrade pip flake8 coverage
      - name: Static analysis (flake8)
        run: python -m flake8 src tests
      - name: Unit and integration tests
        run: python -m coverage run --branch --source=src -m unittest discover -s tests -v
      - name: Coverage report
        run: python -m coverage report --show-missing --fail-under=75
